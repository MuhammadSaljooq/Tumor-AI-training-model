data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  img_size: 224
  batch_size: 32
  num_workers: 4
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

model:
  num_classes: 4
  classes: ["glioma", "meningioma", "pituitary", "no_tumor"]

training:
  epochs: 1
  lr: 0.0003
  weight_decay: 0.0001
  patience: 8
  min_delta: 0.001
  device: "cpu"
  seed: 42
  cudnn_deterministic: false
  save_last_checkpoint: true
  use_class_weights: true
  use_weighted_sampler: true

paths:
  checkpoints: "results/checkpoints"
  plots: "results/plots"
  logs: "results/logs"
